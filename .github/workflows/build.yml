name: CI

on: [push, pull_request]

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The shared dependency-free library (src/lib) is deliberately duplicated between homebridge-unifi-access and homebridge-unifi-protect. Fail if the copies drift.
  lib-sync:
    name: Shared library sync check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Compare src/lib against the sibling repository
        run: ./scripts/check-lib-sync.sh
