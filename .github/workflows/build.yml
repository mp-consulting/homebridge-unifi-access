name: CI

# Pushes are only built on main. A branch with an open pull request would otherwise
# run the whole matrix twice: once for the push event and once for the pull_request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.node-version != '24.x'
        run: npm test

      # Run coverage on a single leg of the matrix so the coverage thresholds are enforced without repeating the work on every Node version.
      - name: Test with coverage
        if: matrix.node-version == '24.x'
        run: npm run test:coverage

  # The shared dependency-free library (src/lib) is deliberately duplicated between homebridge-unifi-access and homebridge-unifi-protect. Fail if the copies drift.
  lib-sync:
    name: Shared library sync check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The script defaults its sibling to this repository's own name, so we must name the protect repository explicitly or it compares us against ourselves.
      - name: Compare src/lib against the sibling repository
        run: ./scripts/check-lib-sync.sh mp-consulting/homebridge-unifi-protect
